    <!-- 内联 CSS 样式 -->
    <style>
        /* 基础重置 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #e0e0e0;
        }

        /* 卡片主体容器 */
        #index_card {
            width: 85%;
            max-width: 750px;
            margin: 120px auto 50px auto;
            background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%); /* 渐变蓝绿背景 */
            border-radius: 15px;
            padding: 40px 20px 20px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* 【核心优化】头像样式 */
        #geekbao {
            display: block;
            width: 150px;              /* 尺寸 */
            height: 150px;             /* 保持正方形 */
            border-radius: 50%;        /* 变为正圆形 */
            border: 6px solid #ffffff; /* 白色边框与背景融合 */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); /* 悬浮投影 */
            object-fit: cover;         /* 图片不拉伸 */
            background-color: #fff;    /* 图片内部的底色（防止透明） */
            margin: -105px auto 10px auto; /* 向上拉出卡片上方，并用 auto 居中 */
            position: relative;
            z-index: 10;
        }

        /* 按钮容器 */
        .buttones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        /* 按钮美化 */
        .button_1 {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            color: #222;
            cursor: pointer;
            min-width: 130px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .button_1:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .button_1 b { font-weight: 400; }

        /* 图标占用 */
        #icons { margin-top: 15px; margin-bottom: 0; }
        .iconfont { font-size: 26px; margin: 0 5px; }
    </style>
